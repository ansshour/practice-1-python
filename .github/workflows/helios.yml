name: Helios

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy, roll back main, or demonstrate an interrupted upload
        type: choice
        options: [deploy, rollback, interrupt]
        default: deploy

permissions:
  contents: read

concurrency:
  group: helios
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: helios

    env:
      HELIOS_HOST: ${{ vars.HELIOS_HOST }}
      HELIOS_USER: ${{ vars.HELIOS_USER }}
      HELIOS_PORT: ${{ vars.HELIOS_PORT }}
      HELIOS_URL: ${{ vars.HELIOS_URL }}
      OPERATION: ${{ inputs.operation || 'deploy' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.24"
          enable-cache: true

      - name: Configure destination
        run: bash scripts/helios-ci.sh destination

      - run: uv sync --locked

      - if: env.OPERATION != 'rollback'
        run: uv run --frozen mkdocs build --strict

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: bash scripts/helios-ci.sh ssh

      - name: Deploy or rollback
        run: bash scripts/helios-deploy.sh "$OPERATION" "$CHANNEL" "$RELEASE"

      - name: Remove credentials
        if: always()
        run: bash scripts/helios-ci.sh cleanup
