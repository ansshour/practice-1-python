name: Build and publish site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync --locked
      # Project Pages publishes the site under the repository name.
      - run: uv run --frozen mkdocs build --strict
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/practice-1-python/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check published page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl --silent --show-error --location --max-time 20 --output /tmp/page.html --write-out '%{http_code}' "${PAGE_URL}example/")
            if [ "$code" = 200 ] && grep -q 'practice-1-site-ready' /tmp/page.html; then
              exit 0
            fi
            sleep 10
          done
          echo 'Published page did not pass healthcheck'
          exit 1
